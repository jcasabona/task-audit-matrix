<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Audit Matrix</title>
<style>
  :root {
    --bg: #F5EFE0;
    --navy: #14304A;
    --yellow: #E8C463;
    --muted: #6B6356;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--navy); font-family: Georgia, "Times New Roman", serif; }
  body { min-height: 100vh; padding: 32px 24px 120px; }

  .wrap { max-width: 1200px; margin: 0 auto; }

  h1 {
    text-align: center;
    font-size: clamp(40px, 6vw, 72px);
    font-weight: 700;
    letter-spacing: -0.5px;
    margin: 8px 0 24px;
  }

  /* Matrix */
  .matrix {
    position: relative;
    aspect-ratio: 16 / 9;
    width: 100%;
    margin: 16px 0 32px;
  }
  .axis-label {
    position: absolute;
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: clamp(11px, 1.1vw, 16px);
    letter-spacing: 3px;
    color: var(--navy);
    text-transform: uppercase;
  }
  .axis-label.planned  { top: 6%;  left: 18%; }
  .axis-label.reactive { top: 6%;  right: 18%; }
  .axis-label.focus    { left: 1%; top: 28%;  writing-mode: vertical-rl; transform: rotate(180deg); }
  .axis-label.process  { left: 1%; bottom: 8%; writing-mode: vertical-rl; transform: rotate(180deg); }

  /* Hand-drawn cross via SVG */
  .cross { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* Quadrants */
  .quad {
    position: absolute;
    width: 50%;
    height: 50%;
    padding: 8% 4% 4%;
    overflow: hidden;
  }
  .quad.q1 { top: 0;    left: 0;    text-align: left;   padding-left: 8%;  }
  .quad.q2 { top: 0;    right: 0;   text-align: right;  padding-right: 8%; }
  .quad.q3 { bottom: 0; left: 0;    text-align: left;   padding-left: 8%;  padding-top: 4%; }
  .quad.q4 { bottom: 0; right: 0;   text-align: right;  padding-right: 8%; padding-top: 4%; }

  .task {
    display: block;
    font-family: Georgia, serif;
    font-size: clamp(14px, 1.5vw, 22px);
    color: var(--navy);
    margin: 0.35em 0;
    line-height: 1.25;
    cursor: pointer;
    position: relative;
  }
  .task .x {
    opacity: 0;
    margin-left: 8px;
    color: #B33;
    font-size: 0.8em;
    font-family: system-ui, sans-serif;
  }
  .task:hover .x { opacity: 1; }

  /* Stagger task indent so they cascade in the quadrant like the reference */
  .quad.q1 .task:nth-child(2) { margin-left:  20px; }
  .quad.q1 .task:nth-child(3) { margin-left:  40px; }
  .quad.q1 .task:nth-child(4) { margin-left:  60px; }
  .quad.q1 .task:nth-child(5) { margin-left:  80px; }
  .quad.q1 .task:nth-child(6) { margin-left: 100px; }
  .quad.q1 .task:nth-child(7) { margin-left: 120px; }
  .quad.q1 .task:nth-child(n+8) { margin-left: 140px; }

  .quad.q2 .task:nth-child(2) { margin-right:  20px; }
  .quad.q2 .task:nth-child(3) { margin-right:  40px; }
  .quad.q2 .task:nth-child(4) { margin-right:  60px; }
  .quad.q2 .task:nth-child(5) { margin-right:  80px; }
  .quad.q2 .task:nth-child(6) { margin-right: 100px; }
  .quad.q2 .task:nth-child(7) { margin-right: 120px; }
  .quad.q2 .task:nth-child(n+8) { margin-right: 140px; }

  .quad.q3 .task:nth-child(1) { margin-left:  60px; }
  .quad.q3 .task:nth-child(2) { margin-left:  40px; }
  .quad.q3 .task:nth-child(3) { margin-left:  20px; }
  .quad.q3 .task:nth-child(4) { margin-left:   0px; }
  .quad.q3 .task:nth-child(n+5) { margin-left: 0px; }

  .quad.q4 .task:nth-child(1) { margin-right:  60px; }
  .quad.q4 .task:nth-child(2) { margin-right:  40px; }
  .quad.q4 .task:nth-child(3) { margin-right:  20px; }
  .quad.q4 .task:nth-child(4) { margin-right:   0px; }
  .quad.q4 .task:nth-child(n+5) { margin-right: 0px; }

  /* Add form */
  .panel {
    max-width: 1200px;
    margin: 24px auto 0;
    background: #fff;
    border: 1px solid #E2D9C2;
    border-radius: 10px;
    padding: 18px 20px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03);
    font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .panel h2 {
    margin: 0 0 12px;
    font-family: Georgia, serif;
    font-size: 20px;
    color: var(--navy);
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row input[type=text] {
    flex: 1 1 320px;
    min-width: 220px;
    padding: 10px 12px;
    border: 1px solid #C8BFA8;
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
    background: #FBF8F0;
  }
  .row select {
    padding: 10px 12px;
    border: 1px solid #C8BFA8;
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
    background: #FBF8F0;
  }
  .row button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: var(--navy);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .row button.secondary { background: #fff; color: var(--navy); border: 1px solid #C8BFA8; }
  .row button:hover { opacity: 0.92; }

  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }

  /* Print */
  @media print {
    body { padding: 0; }
    .panel, .hint { display: none !important; }
    .matrix { aspect-ratio: 16 / 10; }
    h1 { margin-top: 24px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Task Audit Matrix</h1>

    <div class="matrix" id="matrix">
      <svg class="cross" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true">
        <!-- Hand-drawn yellow cross. Slightly wavy with two stacked strokes for a marker feel. -->
        <path d="M 500 30 C 502 150, 498 300, 501 420 C 503 480, 499 540, 500 580"
              stroke="#E8C463" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.95" />
        <path d="M 30 300 C 180 302, 360 298, 540 301 C 720 303, 880 299, 970 300"
              stroke="#E8C463" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.95" />
      </svg>

      <div class="axis-label planned">Planned</div>
      <div class="axis-label reactive">Reactive</div>
      <div class="axis-label focus">Focus</div>
      <div class="axis-label process">Process</div>

      <div class="quad q1" id="q1"></div>
      <div class="quad q2" id="q2"></div>
      <div class="quad q3" id="q3"></div>
      <div class="quad q4" id="q4"></div>
    </div>

    <div class="panel">
      <h2>Add a task</h2>
      <form class="row" id="taskForm" autocomplete="off">
        <input type="text" id="taskName" placeholder="e.g., Record podcast" required>
        <select id="taskType" required>
          <option value="Planned">Planned</option>
          <option value="Reactive">Reactive</option>
        </select>
        <select id="taskMode" required>
          <option value="Focus">Focus</option>
          <option value="Process">Process</option>
        </select>
        <button type="submit">Add</button>
        <button type="button" class="secondary" id="printBtn">Print</button>
        <button type="button" class="secondary" id="clearBtn">Clear all</button>
      </form>
      <div class="hint">Click a task on the matrix to remove it. Your entries are saved in this browser only.</div>
    </div>
  </div>

<script>
  const STORE_KEY = "task-audit-matrix:v1";

  const els = {
    form: document.getElementById("taskForm"),
    name: document.getElementById("taskName"),
    type: document.getElementById("taskType"),
    mode: document.getElementById("taskMode"),
    print: document.getElementById("printBtn"),
    clear: document.getElementById("clearBtn"),
    q1: document.getElementById("q1"),
    q2: document.getElementById("q2"),
    q3: document.getElementById("q3"),
    q4: document.getElementById("q4"),
  };

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); }
    catch (_) { return []; }
  }
  function save(tasks) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(tasks)); } catch (_) {}
  }

  function quadrantOf(t) {
    if (t.type === "Planned" && t.mode === "Focus")   return els.q1;
    if (t.type === "Reactive" && t.mode === "Focus")  return els.q2;
    if (t.type === "Planned" && t.mode === "Process") return els.q3;
    return els.q4;
  }

  function render() {
    [els.q1, els.q2, els.q3, els.q4].forEach(q => q.innerHTML = "");
    const tasks = load();
    tasks.forEach((t, idx) => {
      const div = document.createElement("div");
      div.className = "task";
      div.textContent = t.name;
      const x = document.createElement("span");
      x.className = "x";
      x.textContent = "×";
      div.appendChild(x);
      div.addEventListener("click", () => {
        const current = load();
        current.splice(idx, 1);
        save(current);
        render();
      });
      quadrantOf(t).appendChild(div);
    });
  }

  els.form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = els.name.value.trim();
    if (!name) return;
    const tasks = load();
    tasks.push({ name, type: els.type.value, mode: els.mode.value });
    save(tasks);
    els.name.value = "";
    els.name.focus();
    render();
  });

  els.clear.addEventListener("click", () => {
    if (confirm("Remove all tasks from this matrix?")) {
      save([]);
      render();
    }
  });

  els.print.addEventListener("click", () => window.print());

  render();
</script>
</body>
</html>
